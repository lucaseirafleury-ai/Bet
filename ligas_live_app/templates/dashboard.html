<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Sinais — Ligas Nórdicas/Bálticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinais Live">
<meta name="theme-color" content="#0a0c0f">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="brand">SINAIS<span class="brand-accent">·</span>LIVE</span>
    <span class="subbrand">painel de análise pré-live &amp; ao vivo</span>
  </div>
  <div class="ticker" id="ticker">
    {% for id, nome in ligas.items() %}
      <span class="ticker-item"><i class="dot"></i>{{ nome }}</span>
    {% endfor %}
  </div>
  <div class="topbar-right">
    <button id="btn-ativar-push" class="btn-push">🔔 Ativar notificações</button>
    <span id="relogio-status" class="status-pill status-off">monitor: parado</span>
  </div>
</header>
<div id="push-hint" class="push-hint" style="display:none"></div>

<main class="layout">

  <section class="col col-live">
    <div class="panel">
      <h2>Sinais ao vivo</h2>
      <div id="insights-feed" class="feed">
        <p class="empty-state">Nenhum sinal gerado ainda.</p>
      </div>
    </div>
  </section>

  <section class="col col-prelive">
    <div class="panel">
      <h2>Jogos ao vivo agora</h2>
      <div id="live-lista" class="card-grid">
        <p class="empty-state">Nenhum jogo ao vivo monitorado no momento.</p>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Próximos jogos <span class="muted" id="prelive-gerado-em"></span></h2>
      <div id="prelive-lista" class="card-grid">
        <p class="empty-state">Nenhuma análise pré-live ainda.</p>
      </div>
    </div>
  </section>

</main>

<script>
  window.MARGEM_VALOR = {{ margem_valor }};
  window.VAPID_PUBLIC_KEY = {{ vapid_public_key|tojson }};
</script>
<script src="/static/app.js"></script>
</body>
</html>
